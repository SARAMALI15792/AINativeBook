[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -ra
    --strict-markers
    --strict-config
    -v
    --tb=short
    --cov=intellistack/backend/src
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

[coverage:run]
source = intellistack/backend/src/
omit =
    */migrations/*
    */__pycache__/*
    */tests/*
    */venv/*
    */env/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

[ini_options]
asyncio_mode = auto