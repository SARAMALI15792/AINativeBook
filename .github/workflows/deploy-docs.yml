name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'intellistack/content/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments — never cancel in-progress to avoid partial deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with TypeScript support
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './intellistack/content/package-lock.json'

      - name: Install dependencies
        working-directory: ./intellistack/content
        run: npm ci

      - name: Build website
        working-directory: ./intellistack/content
        run: npm run build
        env:
          BETTER_AUTH_URL: ${{ secrets.RAILWAY_AUTH_URL }}
          BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './intellistack/content/build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
