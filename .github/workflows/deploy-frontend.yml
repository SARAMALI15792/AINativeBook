name: Deploy Frontend to Netlify

on:
  push:
    branches:
      - main
    paths:
      - 'intellistack/frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './intellistack/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./intellistack/frontend
        run: npm ci

      - name: Build
        working-directory: ./intellistack/frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://intellistack-backend-production.up.railway.app/api/v1
          NEXT_PUBLIC_AUTH_URL: https://intellistack-auth-production.up.railway.app
          NEXT_PUBLIC_DOCUSAURUS_URL: https://saramali15792.github.io/AINativeBook/

      - name: Deploy to Netlify
        working-directory: ./intellistack/frontend
        run: npx netlify-cli deploy --dir .next --prod --site ${{ secrets.NETLIFY_SITE_ID }} --auth ${{ secrets.NETLIFY_AUTH_TOKEN }}
